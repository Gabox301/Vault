# Vault — golangci-lint v2 —
# Ejecuta: golangci-lint run ./...
# Referencia: https://golangci-lint.run/docs/configuration/file/

version: '2'

run:
  timeout: 3m
  go: '1.26'

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - revive
    - unconvert
    - unparam
    - bodyclose
    - containedctx
    - contextcheck
    - copyloopvar
    - decorder
    - dogsled
    - gocritic
    - gocyclo
    - gosec
    - noctx
    - prealloc
    - whitespace
  settings:
    gocyclo:
      min-complexity: 40
    misspell:
      locale: US
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - dupl
      - path: internal/adapters/wailsapp
        text: exported.*should have comment
        linters:
          - revive
    paths:
      - build
      - third_party
      - builtin

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports

output:
  formats:
    text:
      path: stdout
      print-issued-lines: true
      print-linter-name: true
